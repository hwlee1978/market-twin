c','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" fill="#7c5b09">ⓘ 멀티-LLM = (1) 신뢰성(폴백)  (2) 교차검증 신호(프로바이더 합의 → 앙상블 confidence).  앙상블은 의도적으로 서로 다른 프로바이더에 sim을 배분.</text>
